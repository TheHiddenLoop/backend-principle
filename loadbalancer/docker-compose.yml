services:

  app1:
    build: .
    environment:
      SERVER_NAME: APP-1

  app2:
    build: .
    environment:
      SERVER_NAME: APP-2

  app3:
    build: .
    environment:
      SERVER_NAME: APP-3

  app4:
    build: .
    environment:
      SERVER_NAME: APP-4

  app5:
    build: .
    environment:
      SERVER_NAME: APP-5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - app4
      - app5